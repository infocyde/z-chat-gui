# zchat settings. Secrets (API key, base URL) stay in ../.env; this file is for how the app behaves.
# Restart the server after editing.

# Coding Plan meters in the sidebar (5-hour and weekly limits). Only shown with a Coding Plan key.
plan_usage:
  # Loading or reloading a page always asks Z.ai for fresh numbers. After that, when to ask again
  # (in between, the last numbers are shown):
  #   replies - after every `every_replies` chat replies
  #   seconds - every `every_seconds` seconds while a zchat page is open
  refresh_by: replies
  every_replies: 5
  every_seconds: 60

# Long stories. When a chat's context gets big, older messages are replaced by an editable
# "Story so far" summary, so the story never runs out of room (and requests stay cheaper).
story_summary:
  # Summarize before the next reply once the context reaches this many tokens, or 80% of the
  # model's context window if that is smaller. 0 = only when you press "Summarize".
  at_tokens: 100000
  # The newest messages are always sent word for word, never summarized.
  keep_recent: 10

# Lorebooks. A scenario's lorebook is copied into each chat started from it. Before every reply, the
# chat's lorebook is searched and only the best-matching entries are sent, with your newest message.
lorebook:
  # How many of the newest messages are searched for things the lorebook knows about.
  scan_messages: 4
  # At most this many entries go with one reply, and roughly this many tokens of them.
  max_entries: 4
  max_tokens: 800
  # Also search by meaning ("something rises from the bog" finds the swamp witch), with a small
  # local model that is downloaded once (~70 MB). false = word matching only.
  vectors: true
  # How close in meaning an entry must be to count (0 to 1). Higher = stricter. 0.5 measured best
  # (scripts/lore_eval.py): lower drags in unrelated entries, 0.6 and up finds nothing words don't.
  min_similarity: 0.5
  # Every this many replies, the model updates the chat's lorebook with what happened. 0 = never.
  update_every_replies: 10
