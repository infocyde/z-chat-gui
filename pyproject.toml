[project]
name = "zchat"
version = "0.1.0"
description = "FastHTML chat client for Z.ai (GLM) with branching chats, scenarios, images and documents"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "markdown-it-py>=4.3.0",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-fasthtml>=0.14.23",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "sqlite-vec>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
